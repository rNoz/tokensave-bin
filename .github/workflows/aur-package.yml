name: Validate AUR package

on:
  push:
    paths:
      - '.github/workflows/aur-package.yml'
      - '.SRCINFO'
      - 'PKGBUILD'
      - 'README.md'
      - 'LICENSE'
      - 'docs/**'
      - 'scripts/**'
      - 'tests/**'
  pull_request:
    paths:
      - '.github/workflows/aur-package.yml'
      - '.SRCINFO'
      - 'PKGBUILD'
      - 'README.md'
      - 'LICENSE'
      - 'docs/**'
      - 'scripts/**'
      - 'tests/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Build and smoke-test package
    runs-on: ubuntu-latest
    container: archlinux:base-devel@sha256:307b7161a9ad33b180f6a24532c9c05841012d129acc0ceafa8b9c7234b62148
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install package validation tools
        run: |
          pacman -Sy --noconfirm archlinux-keyring
          pacman -Syu --noconfirm namcap shadow
          useradd --create-home --user-group builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Run static linters
        run: |
          pacman -S --noconfirm --needed shellcheck python-flake8
          shellcheck -s bash -e SC2034,SC2154,SC2164 PKGBUILD
          flake8 --max-line-length=120 scripts/ tests/

      - name: Run security audit via aurscan
        run: |
          curl -fsSL https://github.com/manticore-projects/aurscan/releases/download/v0.9.1/aurscan-linux-amd64 -o /usr/local/bin/aurscan
          echo "2edb094a0cc69a2bc20bc6a9e3d4c16969306e09507be112de285a0ac68d5b70  /usr/local/bin/aurscan" | sha256sum -c
          chmod +x /usr/local/bin/aurscan
          runuser -u builder -- aurscan --rules-only .

      - name: Validate shell syntax and generated metadata
        run: |
          runuser -u builder -- bash -c 'bash -n PKGBUILD'
          runuser -u builder -- bash -c \
            'makepkg --printsrcinfo | diff -u .SRCINFO -'
          runuser -u builder -- python3 -m unittest discover -s tests -v

      - name: Verify sources and build packages
        run: |
          runuser -u builder -- makepkg --verifysource --force
          runuser -u builder -- makepkg --cleanbuild --clean --force
          sed 's/CARCH=.*/CARCH="aarch64"/; s/CHOST=.*/CHOST="aarch64-unknown-linux-gnu"/' /etc/makepkg.conf > /tmp/makepkg-aarch64.conf
          grep -q '^CARCH="aarch64"' /tmp/makepkg-aarch64.conf
          runuser -u builder -- makepkg --config /tmp/makepkg-aarch64.conf --verifysource --force
          runuser -u builder -- makepkg --config /tmp/makepkg-aarch64.conf --cleanbuild --clean --force

      - name: Inspect packages without installation
        run: |
          runuser -u builder -- bash -s <<'EOF'
          set -e
          binary_path='usr/bin/tokensave'
          license_path='usr/share/licenses/tokensave-bin/LICENSE'

          x86_pkgfile=$(find . -maxdepth 1 -type f -name 'tokensave-bin-*-x86_64.pkg.tar.*' -print -quit)
          test -n "$x86_pkgfile"
          namcap PKGBUILD "$x86_pkgfile"
          bsdtar -tf "$x86_pkgfile" | grep -Fx "$binary_path"
          bsdtar -tf "$x86_pkgfile" | grep -Fx "$license_path"
          pacman -Qp --info "$x86_pkgfile"

          aarch64_pkgfile=$(find . -maxdepth 1 -type f -name 'tokensave-bin-*-aarch64.pkg.tar.*' -print -quit)
          test -n "$aarch64_pkgfile"
          namcap PKGBUILD "$aarch64_pkgfile"
          bsdtar -tf "$aarch64_pkgfile" | grep -Fx "$binary_path"
          bsdtar -tf "$aarch64_pkgfile" | grep -Fx "$license_path"
          pacman -Qp --info "$aarch64_pkgfile"
          EOF

      - name: Inspect aarch64 ELF binary
        run: |
          runuser -u builder -- bash -s <<'EOF'
          set -e
          aarch64_pkgfile=$(find . -maxdepth 1 -type f -name 'tokensave-bin-*-aarch64.pkg.tar.*' -print -quit)
          test -n "$aarch64_pkgfile"
          root=$(mktemp -d)
          trap 'rm -rf "$root"' EXIT
          bsdtar -xf "$aarch64_pkgfile" -C "$root"
          readelf -h "$root/usr/bin/tokensave" | grep -E 'Class:\s+ELF64'
          readelf -h "$root/usr/bin/tokensave" | grep -E 'Machine:\s+AArch64'
          readelf -d "$root/usr/bin/tokensave" | grep NEEDED
          EOF

      - name: Smoke-test upstream x86_64 executable on trusted events
        if: github.event_name != 'pull_request'
        run: |
          runuser -u builder -- bash -s <<'EOF'
          set -e
          x86_pkgfile=$(find . -maxdepth 1 -type f -name 'tokensave-bin-*-x86_64.pkg.tar.*' -print -quit)
          test -n "$x86_pkgfile"
          root=$(mktemp -d)
          trap 'rm -rf "$root"' EXIT
          bsdtar -xf "$x86_pkgfile" -C "$root"
          expected_version=$(sed -n 's/^pkgver=//p' PKGBUILD)
          "$root/usr/bin/tokensave" --version | grep -Fx "tokensave $expected_version"
          "$root/usr/bin/tokensave" --help >/dev/null
          EOF

      - name: Upload package metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tokensave-bin-metadata
          path: |
            PKGBUILD
            .SRCINFO
          if-no-files-found: error
