name: Update upstream release

on:
  schedule:
    - cron: '17 * * * *'
  repository_dispatch:
    types:
      - tokensave-release-published
  workflow_dispatch:
    inputs:
      tag:
        description: 'Stable upstream tag to replay, for example v7.13.0'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-upstream-release
  cancel-in-progress: false

jobs:
  update:
    name: Prepare upstream release update
    runs-on: ubuntu-latest
    container: archlinux:base-devel@sha256:307b7161a9ad33b180f6a24532c9c05841012d129acc0ceafa8b9c7234b62148
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
          persist-credentials: true

      - name: Install release update tools
        run: |
          pacman -Sy --noconfirm archlinux-keyring
          pacman -Syu --noconfirm github-cli git python
          useradd --create-home --user-group builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Update release metadata
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          DISPATCH_TAG: ${{ github.event.client_payload.tag }}
          MANUAL_TAG: ${{ inputs.tag }}
        run: |
          set -eu
          cd "$GITHUB_WORKSPACE"
          tag="${DISPATCH_TAG:-${MANUAL_TAG:-}}"
          if [ -n "$tag" ]; then
            runuser -u builder -- env GITHUB_TOKEN="$GITHUB_TOKEN" \
              python3 scripts/update_release.py --tag "$tag"
          else
            runuser -u builder -- env GITHUB_TOKEN="$GITHUB_TOKEN" \
              python3 scripts/update_release.py
          fi
          runuser -u builder -- bash -c 'makepkg --printsrcinfo > .SRCINFO'

      - name: Check generated changes
        id: changes
        run: |
          set -eu
          cd "$GITHUB_WORKSPACE"
          version=$(sed -n 's/^pkgver=//p' PKGBUILD)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          git diff --check
          if [ -z "$(git status --porcelain -- PKGBUILD .SRCINFO README.md docs/releases)" ]; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update release pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          VERSION: ${{ steps.changes.outputs.version }}
        run: |
          set -eu
          cd "$GITHUB_WORKSPACE"
          branch="automation/tokensave-v${VERSION}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B "$branch"
          git add PKGBUILD .SRCINFO README.md "docs/releases/v${VERSION}.md"
          git commit -m "chore: prepare tokensave v${VERSION}"
          git push --force-with-lease origin "$branch"
          gh workflow run aur-package.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"

          existing=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --head "$branch" --json url --jq '.[0].url')
          if [ -z "$existing" ]; then
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base "${{ github.event.repository.default_branch }}" \
              --head "$branch" \
              --title "chore: prepare tokensave v${VERSION}" \
              --body "$(printf '%s\n\n%s\n\n%s\n' \
                'Automated upstream release update.' \
                '- PKGBUILD checksums were derived from the upstream SHA256SUMS asset.' \
                '- README metadata, generated .SRCINFO, and upstream release notes were updated.')"
          else
            printf 'Updated existing pull request: %s\n' "$existing"
          fi
