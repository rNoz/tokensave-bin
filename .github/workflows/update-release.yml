name: Update upstream release

on:
  schedule:
    - cron: '17 * * * *'
  repository_dispatch:
    types:
      - tokensave-release-published
  workflow_dispatch:
    inputs:
      tag:
        description: 'Newer stable upstream tag to prepare, for example v7.13.0'
        required: false
        type: string

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: update-upstream-release
  cancel-in-progress: false

jobs:
  update:
    name: Prepare upstream release update
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
          persist-credentials: true

      - name: Update release metadata
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          DISPATCH_TAG: ${{ github.event.client_payload.tag }}
          MANUAL_TAG: ${{ inputs.tag }}
        run: |
          set -eu
          cd "$GITHUB_WORKSPACE"
          tag="${DISPATCH_TAG:-${MANUAL_TAG:-}}"
          if [ -n "$tag" ]; then
            env GITHUB_TOKEN="$GITHUB_TOKEN" \
              python3 scripts/update_release.py --tag "$tag"
          else
            env GITHUB_TOKEN="$GITHUB_TOKEN" \
              python3 scripts/update_release.py
          fi

      - name: Generate .SRCINFO in Arch Linux
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace:ro" \
            archlinux:base-devel@sha256:307b7161a9ad33b180f6a24532c9c05841012d129acc0ceafa8b9c7234b62148 \
            bash -euc '
              pacman -Sy --noconfirm archlinux-keyring shadow >&2
              useradd --create-home --user-group builder
              mkdir /tmp/package
              cp /workspace/PKGBUILD /tmp/package/PKGBUILD
              chown -R builder:builder /tmp/package
              cd /tmp/package
              runuser -u builder -- makepkg --printsrcinfo
            ' > "$GITHUB_WORKSPACE/.SRCINFO"

      - name: Check generated changes
        id: changes
        run: |
          set -eu
          cd "$GITHUB_WORKSPACE"
          version=$(sed -n 's/^pkgver=//p' PKGBUILD)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          git diff --check
          if [ -z "$(git status --porcelain -- PKGBUILD .SRCINFO README.md)" ]; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update release pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          RELEASE_TOKEN_CONFIGURED: ${{ secrets.RELEASE_TOKEN != '' }}
          VERSION: ${{ steps.changes.outputs.version }}
        run: |
          set -eu
          cd "$GITHUB_WORKSPACE"
          branch="automation/tokensave-v${VERSION}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          expected_sha=$(git ls-remote origin "refs/heads/$branch" | awk '{print $1}')
          if [ -n "$expected_sha" ]; then
            git fetch origin "+refs/heads/$branch:refs/remotes/origin/$branch"
          fi
          git checkout -B "$branch"
          git add PKGBUILD .SRCINFO README.md
          git commit -m "chore: prepare tokensave v${VERSION}"
          if [ -n "$expected_sha" ]; then
            git push --force-with-lease="refs/heads/$branch:$expected_sha" origin "$branch"
          else
            git push --force-with-lease="refs/heads/$branch:" origin "$branch"
          fi

          existing=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --head "$branch" --json url --jq '.[0].url')
          if [ -z "$existing" ]; then
            existing=$(gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base "${{ github.event.repository.default_branch }}" \
              --head "$branch" \
              --title "chore: prepare tokensave v${VERSION}" \
              --body "$(printf '%s\n\n%s\n\n%s\n' \
                'Automated upstream release update.' \
                '- PKGBUILD checksums were derived from the upstream SHA256SUMS asset.' \
                '- README metadata and generated .SRCINFO were updated.')")
          else
            printf 'Updated existing pull request: %s\n' "$existing"
          fi
          if [ "$RELEASE_TOKEN_CONFIGURED" = "true" ]; then
            echo "::notice::Package validation will run from the release-token branch push."
          elif ! gh workflow run aur-package.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"; then
            echo "::warning::Could not dispatch package validation for $branch; the pull request remains open for manual validation."
          fi
